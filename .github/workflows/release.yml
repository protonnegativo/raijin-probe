name: release

# Tags every change to the default branch that the binary builds from, and creates its GitHub Release.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: .github/release.sh "$BUMP" "$BEFORE"
